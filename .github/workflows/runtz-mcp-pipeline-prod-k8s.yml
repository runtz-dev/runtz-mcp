---
name: runtz-mcp CI/CD Prod
on:
  release:
    types:
      - published

jobs:
  publish-image:
    name: Publish public image (Docker Hub)
    runs-on:
      - runtz-runners
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASS }}
      - name: Build and push multi-arch image
        run: |
          VERSION="$(cat VERSION)"
          TAGS="--tag runtzdev/runtz-mcp:${VERSION}"
          case "$VERSION" in
            *-*) ;;
            *) TAGS="$TAGS --tag runtzdev/runtz-mcp:latest" ;;
          esac
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            $TAGS \
            --build-arg LDFLAGS="-s -w -X main.version=${VERSION}" \
            --push \
            .

  publish-chart:
    name: Publish Helm chart (ChartMuseum)
    runs-on:
      - runtz-runners
    container:
      image: runtzdev/deploy-k8s:v1
      credentials:
        username: ${{ vars.DOCKER_LOGIN }}
        password: ${{ secrets.DOCKER_PASS }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Lint, package and push chart
        env:
          CHARTMUSEUM_USER: ${{ secrets.CHARTMUSEUM_USER }}
          CHARTMUSEUM_PASSWORD: ${{ secrets.CHARTMUSEUM_PASSWORD }}
        run: ./scripts/helm-release.sh

  deploy-prod:
    name: Deploy prod
    runs-on:
      - runtz-runners
    needs:
      - publish-image
      - publish-chart
    container:
      image: runtzdev/deploy-k8s:v1
      credentials:
        username: ${{ vars.DOCKER_LOGIN }}
        password: ${{ secrets.DOCKER_PASS }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Add ChartMuseum repo
        run: |
          helm repo add runtz https://helm.runtz.dev
          helm repo update
      - name: Deploy on prod environment
        run: |
          VERSION="$(cat VERSION)"
          helm upgrade --install runtz-mcp runtz/runtz-mcp \
            --version "$VERSION" \
            -n prod \
            -f helm/environments/prod/values.yaml \
            --set "image.tag=${VERSION}"

# Default values for the hosted runtz MCP server.
#
# This server is docs-only: it exposes the runtz documentation over the MCP
# streamable HTTP transport. There is no other mode — scans need the user's
# code on the machine running the CLI, so they're never wired in here.

replicaCount: 1

image:
  repository: runtzdev/runtz-mcp
  # Defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

# Non-secret configuration rendered into a ConfigMap and injected as env.
env:
  RUNTZ_MCP_ADDR: ":8080"

extraEnv: []

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
resources: {}

livenessProbe:
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  httpGet:
    path: /healthz
    port: http

nodeSelector: {}
tolerations: []
affinity: {}

# Disabled and unopinionated by default: set the class your cluster actually
# runs (nginx, traefik, alb, ...) and your own hostname.
#
#   ingress:
#     enabled: true
#     className: nginx
#     hosts:
#       - host: mcp.example.com
#         paths:
#           - path: /
#             pathType: Prefix
#     tls:
#       - secretName: runtz-mcp-tls
#         hosts:
#           - mcp.example.com
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

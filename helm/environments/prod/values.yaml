# runtz-mcp production environment (mcp.runtz.dev).
#
# Uses the generic public Docker Hub image. Deployed by the prod pipeline on
# release publish, installing the chart from ChartMuseum with the tag injected
# via --set.
#
#   helm upgrade --install runtz-mcp runtz/runtz-mcp \
#     -f helm/environments/prod/values.yaml \
#     --set image.tag="<version>"

image:
  repository: runtzdev/runtz-mcp
  tag: ""
  pullPolicy: IfNotPresent

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

env:
  RUNTZ_MCP_ADDR: ":8080"
  # Traces and metrics go to the in-cluster SigNoz collector. ClusterIP only,
  # so this is the FQDN — the short name would not resolve from the prod
  # namespace.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://signoz-otel-collector.signoz.svc.cluster.local:4318"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=prod,service.namespace=runtz"

# Routing is NOT part of this release: mcp.runtz.dev and the cloudflare-tunnel
# ingress class are specific to our cluster, so the Ingress object lives in the
# private secrets-helm folder (ingress-prod.yaml) and is applied with kubectl.
# The chart ships generic ingress support that stays disabled here.
ingress:
  enabled: false

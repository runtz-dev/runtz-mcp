# runtz-mcp development environment (mcp-dev.runtz.dev).
#
# Image is built and pushed by the dev pipeline to the in-cluster registry;
# the tag is injected at deploy time with --set.
#
#   helm upgrade --install runtz-mcp ./helm/runtz-mcp \
#     -f helm/environments/dev/values.yaml \
#     --set image.tag="dev<sha>"

image:
  repository: registry.local:5000/runtz-mcp
  tag: ""
  pullPolicy: Always

env:
  RUNTZ_MCP_ADDR: ":8080"
  # Traces and metrics go to the in-cluster SigNoz collector. ClusterIP only,
  # so this is the FQDN — the short name would not resolve from the dev
  # namespace.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://signoz-otel-collector.signoz.svc.cluster.local:4318"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=dev,service.namespace=runtz"

# Routing is NOT part of this release: mcp-dev.runtz.dev and the cloudflare-tunnel
# ingress class are specific to our cluster, so the Ingress object lives in the
# private secrets-helm folder (ingress-dev.yaml) and is applied with kubectl.
# The chart ships generic ingress support that stays disabled here.
ingress:
  enabled: false
